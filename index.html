<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1677ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      /**
       * Storage shim：iOS Safari 无痕模式 / 浏览器禁用 Cookie 时 localStorage
       * 会在写入时抛 SecurityError，导致整个 app bootstrap 崩溃白屏。
       * 这里在任何模块执行前，先探测可用性；不可用则用一个内存版替换，
       * 保证后续全部 localStorage.* 调用不再 throw（会话期内 in-memory 有效）。
       */
      ;(function () {
        try {
          var k = '__ls_probe__'
          localStorage.setItem(k, '1')
          localStorage.removeItem(k)
        } catch (_e) {
          var store = Object.create(null)
          var shim = {
            getItem: function (k) {
              return k in store ? store[k] : null
            },
            setItem: function (k, v) {
              store[k] = String(v)
            },
            removeItem: function (k) {
              delete store[k]
            },
            clear: function () {
              store = Object.create(null)
            },
            key: function (i) {
              return Object.keys(store)[i] || null
            },
          }
          Object.defineProperty(shim, 'length', {
            get: function () {
              return Object.keys(store).length
            },
          })
          try {
            Object.defineProperty(window, 'localStorage', {
              value: shim,
              writable: false,
              configurable: true,
            })
          } catch (_) {
            /* 某些 UA 冻结了 window 属性，无能为力 */
          }
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
