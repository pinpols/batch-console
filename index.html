<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS apple-touch-icon:优先 PNG(老版 iOS 不识 SVG),fallback SVG -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1677ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BC" />
    <!-- black-translucent: 状态栏透明,内容延伸到顶部,沉浸式(类 X / 推特);
         配合 viewport-fit=cover + safe-area-inset 让 MobileAppBar 自己 padding-top -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <!-- iOS apple-touch-startup-image:多分辨率精确匹配各 iPhone/iPad 启动图,
         否则 PWA 启动会看到白屏一秒。media query 由 @yusukehirao/web-app-startup-image
         逻辑精简而来:device-width × device-pixel-ratio 唯一匹配 -->
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/icons/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/icons/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/icons/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/icons/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="/icons/splash-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/icons/splash-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" href="/icons/splash-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/icons/splash-750x1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2)" href="/icons/splash-1640x2360.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" href="/icons/splash-2048x2732.png" />

    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      /**
       * Storage shim：iOS Safari 无痕模式 / 浏览器禁用 Cookie 时 localStorage
       * 会在写入时抛 SecurityError，导致整个 app bootstrap 崩溃白屏。
       * 这里在任何模块执行前，先探测可用性；不可用则用一个内存版替换，
       * 保证后续全部 localStorage.* 调用不再 throw（会话期内 in-memory 有效）。
       */
      ;(function () {
        try {
          var k = '__ls_probe__'
          localStorage.setItem(k, '1')
          localStorage.removeItem(k)
        } catch (_e) {
          var store = Object.create(null)
          var shim = {
            getItem: function (k) {
              return k in store ? store[k] : null
            },
            setItem: function (k, v) {
              store[k] = String(v)
            },
            removeItem: function (k) {
              delete store[k]
            },
            clear: function () {
              store = Object.create(null)
            },
            key: function (i) {
              return Object.keys(store)[i] || null
            },
          }
          Object.defineProperty(shim, 'length', {
            get: function () {
              return Object.keys(store).length
            },
          })
          try {
            Object.defineProperty(window, 'localStorage', {
              value: shim,
              writable: false,
              configurable: true,
            })
          } catch (_) {
            /* 某些 UA 冻结了 window 属性，无能为力 */
          }
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
