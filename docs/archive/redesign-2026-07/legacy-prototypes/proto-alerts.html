<div class="bc-screen" data-screen-label="告警中心" style="max-width:1100px; margin:0 auto; padding:28px 32px 40px 32px;">
          <div style="display:flex; align-items:flex-end; gap:16px; margin-bottom:18px;">
            <div>
              <div style="font-size:18px; font-weight:600; letter-spacing:-0.01em;">告警中心</div>
              <div style="margin-top:3px; color:var(--text-2); font-size:13px;">按严重程度处理运行告警,确认后自动归档</div>
            </div>
            <div style="flex:1;"></div>
            <button onclick="{{ alertRules }}" style="height:var(--control-h); padding:0 14px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text-1); font-size:13px; cursor:pointer; font-family:inherit;" style-hover="background:var(--bg-hover); border-color:var(--border-strong);">告警路由规则</button>
          </div>
          <div style="display:flex; align-items:center; gap:6px; margin-bottom:14px;">
            <sc-for list="{{ alertTabs }}" as="tab" hint-placeholder-count="3">
              <div onclick="{{ tab.select }}" style="display:inline-flex; align-items:center; gap:7px; height:28px; padding:0 12px; border-radius:14px; cursor:pointer; font-size:12.5px; border:1px solid {{ tab.border }}; color: {{ tab.color }}; background: {{ tab.bg }}; font-weight: {{ tab.weight }};" style-hover="border-color:var(--border-strong);">
                <sc-if value="{{ tab.hasDot }}" hint-placeholder-val="{{ false }}"><span style="width:6px; height:6px; border-radius:50%; background: {{ tab.dotColor }};"></span></sc-if>
                <span>{{ tab.label }}</span>
                <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; color: {{ tab.countColor }};">{{ tab.count }}</span>
              </div>
            </sc-for>
            <span style="flex:1;"></span>
            <input placeholder="搜索告警内容" style="height:var(--control-h); width:220px; padding:0 10px; border:1px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--text-1); font-size:13px; outline:none; font-family:inherit;" style-focus="border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);">
            <div style="height:var(--control-h); display:flex; align-items:center; gap:6px; padding:0 10px; border:1px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--text-3); cursor:pointer;" style-hover="border-color:var(--border-strong);"><span>严重程度</span><span style="font-size:10px;">▾</span></div>
          </div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <sc-for list="{{ alerts }}" as="a" hint-placeholder-count="6">
              <div onclick="{{ a.openDetail }}" style="display:flex; align-items:flex-start; gap:14px; padding:14px 16px; background: {{ a.cardBg }}; border:1px solid var(--border); border-left:3px solid {{ a.sevColor }}; border-radius:12px; cursor:pointer;" style-hover="border-color:var(--border-strong); box-shadow:var(--shadow-card);">
                <span style="width:34px; height:34px; border-radius:9px; background: {{ a.sevBg }}; color: {{ a.sevColor }}; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><span style="width:17px; height:17px; display:flex;">{{ a.sevIcon }}</span></span>
                <div style="flex:1; min-width:0;">
                  <div style="display:flex; align-items:center; gap:8px;">
                    <span style="font-size:10.5px; font-weight:600; padding:1px 7px; border-radius:5px; background: {{ a.sevBg }}; color: {{ a.sevColor }};">{{ a.sevLabel }}</span>
                    <span style="font-size:11px; color:var(--text-3);">今天 {{ a.time }}</span>
                  </div>
                  <div style="font-size:13.5px; color: {{ a.titleColor }}; margin-top:6px; line-height:1.5;">{{ a.title }}</div>
                  <div style="margin-top:7px;"><span style="font-size:11px; padding:1px 7px; border-radius:5px; background:var(--bg-elev); color:var(--text-3); font-family:'IBM Plex Mono',monospace;">{{ a.src }}</span></div>
                </div>
                <div style="flex-shrink:0; display:flex; align-items:center; gap:2px;">
                  <sc-if value="{{ a.pending }}" hint-placeholder-val="{{ true }}">
                    <span onclick="{{ a.ack }}" style="font-size:12px; color:var(--accent); cursor:pointer; padding:5px 11px; border-radius:7px; border:1px solid var(--border);" style-hover="background:var(--accent-soft); border-color:var(--accent);">确认</span>
                    <span onclick="{{ silence24 }}" style="font-size:12px; color:var(--text-2); cursor:pointer; padding:5px 11px; border-radius:7px;" style-hover="background:var(--bg-hover); color:var(--text-1);">静默 24h</span>
                  </sc-if>
                  <sc-if value="{{ a.acked }}" hint-placeholder-val="{{ false }}">
                    <span style="display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:7px; font-size:11px; color:var(--success); background:var(--success-soft);">✓ 已确认</span>
                  </sc-if>
                </div>
              </div>
            </sc-for>
            <sc-if value="{{ alertsEmpty }}" hint-placeholder-val="{{ false }}">
              <div style="padding:56px; text-align:center; color:var(--text-3); font-size:13px; background:var(--bg-card); border:1px solid var(--border); border-radius:12px;">当前分组没有告警</div>
            </sc-if>
          </div>
        </div>
