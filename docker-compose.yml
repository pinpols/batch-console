# 单服务部署:前端 nginx 容器,反代到外部 BE
# 用法:
#   docker compose up -d --build              # 默认 BE 走 host.docker.internal:18080
#   BACKEND_UPSTREAM_HOST=10.0.0.5:18080 docker compose up -d   # 覆盖 BE 地址
#   docker compose logs -f frontend           # 看日志
#   docker compose down                       # 停

# compose 项目名 = 在 Docker UI 里显示的 stack 名;与后端 batch-platform 统一前缀。
# 不设则默认取目录名 batch-console。可被 -p / COMPOSE_PROJECT_NAME 覆盖。
name: batch-platform-console

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        backend-docs: ../file-batch-system/docs
      args:
        # 想严格 typecheck 改 build(慢 ~20s);快速发布走 build:fast
        BUILD_MODE: ${BUILD_MODE:-build:fast}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-false}
        VITE_TELEMETRY_ENDPOINT: ${VITE_TELEMETRY_ENDPOINT:-/api/console/telemetry/events}
    image: batch-console:latest
    container_name: batch-console
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-8080}:8080'
    environment:
      # nginx upstream;开发本机:host.docker.internal:18080(macOS/Windows 可直接用,Linux 需要加 extra_hosts)
      # 18080 = 后端 .env.local CONSOLE_API_PORT 的宿主机映射端口;
      # 此默认必须与后端 console-api 实际发布端口一致,否则前端 nginx 反代 502。
      BACKEND_UPSTREAM_HOST: ${BACKEND_UPSTREAM_HOST:-host.docker.internal:18080}
      NGINX_PORT: 8080
    extra_hosts:
      # Linux 需要这行才能让容器解析 host.docker.internal(macOS/Windows 自带)
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 日志旋转:防容器写满磁盘
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
