name: deploy

# build-image 成功 → 自托管 runner 拉 GHCR 镜像重启本地前端容器。
# 前提:
#   1) 自托管 runner 装在部署机,labels = [self-hosted, deploy, windows]。
#   2) Docker Desktop 在跑。
#   3) GITHUB_TOKEN 自动有 packages:read,无需 PAT。
#
# 触发:
#   - workflow_run: 监听 build-image 成功(只 main 分支)
#   - workflow_dispatch: 手动重跑

on:
  workflow_run:
    workflows: ["build-image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag (默认 latest,可填 sha-<full> 精确部署某次构建)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-fe-main
  cancel-in-progress: false   # 部署串行

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, deploy, windows]
    timeout-minutes: 10

    env:
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
      # 前端 docker-compose.yml 用到的端口/上游地址(对齐当前 default)
      HOST_PORT: '8080'
      BACKEND_UPSTREAM_HOST: 'host.docker.internal:18090'

    steps:
      - name: Checkout 部署分支 (含 compose)
        uses: actions/checkout@v4
        with:
          ref: feature/docker-deploy

      - name: 显示部署上下文
        shell: pwsh
        run: |
          Write-Host "触发:        $env:GITHUB_EVENT_NAME"
          Write-Host "镜像 tag:    $env:IMAGE_TAG"
          Write-Host "ref:         $env:GITHUB_REF"
          Write-Host "sha:         $env:GITHUB_SHA"
          Write-Host "frontend 端口: $env:HOST_PORT, 后端上游: $env:BACKEND_UPSTREAM_HOST"

      - name: 登录 GHCR
        shell: pwsh
        run: |
          $env:GITHUB_TOKEN | docker login ghcr.io -u $env:GITHUB_ACTOR --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取镜像
        shell: pwsh
        run: |
          docker compose `
            -f docker-compose.yml `
            -f docker-compose.deploy.yml `
            pull

      - name: 重启服务
        shell: pwsh
        run: |
          docker compose `
            -f docker-compose.yml `
            -f docker-compose.deploy.yml `
            up -d --no-build --remove-orphans

      - name: 等待 healthy
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(60)
          do {
              Start-Sleep -Seconds 2
              $status = (docker inspect --format '{{.State.Health.Status}}' batch-console 2>$null)
              Write-Host "  状态: $status"
          } while ($status -ne 'healthy' -and (Get-Date) -lt $deadline)
          if ($status -ne 'healthy') { throw "batch-console 60s 内未 healthy" }
          Write-Host "✔ batch-console healthy"

      - name: probe 首页
        shell: pwsh
        run: |
          $r = Invoke-WebRequest "http://localhost:$env:HOST_PORT/" -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "首页非 200: $($r.StatusCode)" }
          Write-Host "✔ 首页 200,长度 $($r.Content.Length) bytes"

      - name: 清理悬挂镜像
        if: always()
        shell: pwsh
        run: docker image prune -f
