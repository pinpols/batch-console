name: deploy

# push main → 自托管 runner 在部署机本地 docker compose build 构建 nginx 镜像并重启前端容器。
# (不再拉 GHCR:镜像私有 + 本机 VPN 代理 18081 拉取常被 reset(EOF);部署机即构建机,
#  本地 build 更稳,与后端 deploy 一致。build-image 已删除以免双构建。)
#
# 端口/上游/项目名经 job env 注入,覆盖 docker-compose.yml 的 ${...} 默认值。
#
# 前提:
#   1) 自托管 runner 装在部署机,labels = [self-hosted, deploy, windows]。
#   2) Docker Desktop 在跑(部署机需能拉 docker.io 基础镜像 node/nginx)。
#
# 触发:
#   - push: main(每次 main 推送直接本地构建部署;不再经 build-image —— 本地构建用不到云端镜像)
#   - workflow_dispatch: 手动重跑(回滚/调试用)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fe-main
  cancel-in-progress: false   # 部署串行

jobs:
  deploy:
    runs-on: [self-hosted, deploy, windows]
    timeout-minutes: 15

    env:
      # 前端 docker-compose.yml 用到的端口/上游/项目名(env 注入,覆盖 compose 默认值)
      # 19080 而非 8080:8080 落在 Hyper-V/WinNAT 保留段 8067-8166,绑不上。
      HOST_PORT: '19080'
      BACKEND_UPSTREAM_HOST: 'host.docker.internal:18090'
      # 对齐现有前端 stack 名(compose 无 name:,靠此 env 指定,否则取目录名)
      COMPOSE_PROJECT_NAME: 'batch-platform-console'

    steps:
      - name: Checkout 部署分支 feature/docker-deploy (含 src + compose/Dockerfile/nginx)
        uses: actions/checkout@v4
        with:
          ref: feature/docker-deploy

      - name: 显示部署上下文
        shell: pwsh
        run: |
          Write-Host "触发:        $env:GITHUB_EVENT_NAME"
          Write-Host "ref:         $env:GITHUB_REF"
          Write-Host "sha:         $env:GITHUB_SHA"
          Write-Host "frontend 端口: $env:HOST_PORT, 后端上游: $env:BACKEND_UPSTREAM_HOST, stack: $env:COMPOSE_PROJECT_NAME"

      - name: 本地构建镜像 (部署机本地 build,不从 GHCR 拉)
        shell: pwsh
        run: |
          docker compose `
            -f docker-compose.yml `
            build

      - name: 重启服务
        shell: pwsh
        run: |
          docker compose `
            -f docker-compose.yml `
            up -d --no-build --remove-orphans

      - name: 等待 healthy
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(60)
          do {
              Start-Sleep -Seconds 2
              $status = (docker inspect --format '{{.State.Health.Status}}' batch-console 2>$null)
              Write-Host "  状态: $status"
          } while ($status -ne 'healthy' -and (Get-Date) -lt $deadline)
          if ($status -ne 'healthy') { throw "batch-console 60s 内未 healthy" }
          Write-Host "✔ batch-console healthy"

      - name: probe 首页
        shell: pwsh
        run: |
          $r = Invoke-WebRequest "http://localhost:$env:HOST_PORT/" -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "首页非 200: $($r.StatusCode)" }
          Write-Host "✔ 首页 200,长度 $($r.Content.Length) bytes"

      - name: 清理悬挂镜像
        if: always()
        shell: pwsh
        run: docker image prune -f
