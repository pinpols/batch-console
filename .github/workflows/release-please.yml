name: release-please

# Conventional Commits → 自动 changelog + 版本号 + PR + tag。
# 工作流程:
#   1. push main 触发,release-please-action 扫 commit log
#   2. 发现自上次 release 后有 feat: / fix: / 等可发布的 commit → 开/更新 release PR
#   3. release PR 合并 → 自动打 tag + 生成 GitHub Release + CHANGELOG.md
# 完全跑在 GitHub Actions,无外部服务依赖。
# 配置文件:.release-please-config.json / .release-please-manifest.json

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
