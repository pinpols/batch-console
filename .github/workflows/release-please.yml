name: release-please

# Conventional Commits → 自动 changelog + 版本号 + PR + tag。
# 工作流程:
#   1. 手动从 GitHub Actions UI 触发(workflow_dispatch)
#   2. release-please-action 扫 commit log,发现自上次 release 后有 feat: / fix: / 等
#      可发布的 commit → 开/更新 release PR
#   3. release PR 合并 → 自动打 tag + 生成 GitHub Release + CHANGELOG.md
# 配置文件:.release-please-config.json / .release-please-manifest.json
#
# 历史:曾启用 `on: push: branches: [main]` 自动触发,但发版节奏不固定 + 自动 PR
# 嘈杂,改为手动触发(2026-06-02)。

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
