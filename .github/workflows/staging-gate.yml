name: staging-gate

# staging / pre-prod 部署前最终关:against 真实 staging URL 跑 Playwright + Lighthouse
# 触发:release tag(v*)/ 手动 workflow_dispatch
# 对齐 BE 仓 staging-gate.yml 角色定位

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Staging URL(默认从 secret STAGING_URL 读)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-gate-${{ github.ref }}
  cancel-in-progress: false # staging 验收不要被 push 抢断

jobs:
  # 发布验收必须有真实环境和测试账号；缺少配置属于发布阻断，不允许静默跳过。
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      base_url: ${{ steps.s.outputs.base_url }}
    steps:
      - id: s
        env:
          INPUT_URL: ${{ github.event.inputs.base_url }}
          SECRET_URL: ${{ secrets.STAGING_URL }}
          E2E_USERNAME: ${{ secrets.STAGING_E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: |
          set -euo pipefail
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            echo "::error::STAGING_URL 未配置，发布验收不能跳过。"
            exit 2
          fi
          if [ -z "$E2E_USERNAME" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::STAGING_E2E_USERNAME / STAGING_E2E_PASSWORD 未配置。"
            exit 2
          fi
          URL="${URL%/}"
          curl -fsS "$URL/healthz" >/dev/null
          echo "base_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed revision for release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BASE_URL: ${{ steps.s.outputs.base_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(curl -fsS "$BASE_URL/version.json" | jq -r '.gitSha')
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::staging revision mismatch: expected=$EXPECTED_SHA actual=$actual"
            exit 1
          fi

  e2e-against-staging:
    name: Playwright e2e (full, against staging)
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # base URL 由 precheck 统一计算;
      # E2E_USERNAME/E2E_PASSWORD 走 secret,global-setup 用它建 storageState
      - name: Playwright (full suite against staging)
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.precheck.outputs.base_url }}
          E2E_USERNAME: ${{ secrets.STAGING_E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: npm run test:e2e:all

      - name: Visual regression baseline
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.precheck.outputs.base_url }}
        run: npm run test:e2e:visual

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 30

  lighthouse-against-staging:
    name: Lighthouse (against staging)
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Lighthouse on staging
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ needs.precheck.outputs.base_url }}/
            ${{ needs.precheck.outputs.base_url }}/login
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: '.github/lighthouse-budget.json'
