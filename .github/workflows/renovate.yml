name: Quarterly dependency inventory

# Renovate self-hosted on GitHub Actions —— 无外部服务依赖。
# 仅生成季度依赖盘点，不修改分支、不创建或自动合并 PR。

on:
  schedule:
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        default: 'info'
        type: choice
        options: [info, debug, trace]

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false # 跨次跑不打断,排队

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate Renovate inventory
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: full
          # 限制只跑本仓
          RENOVATE_REPOSITORIES: ${{ github.repository }}

  issue:
    needs: renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open one quarterly review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          month=$((10#$(date -u +%m)))
          quarter=$((((month - 1) / 3) + 1))
          title="前端依赖集中治理 $(date -u +%Y)-Q${quarter}"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" \
              --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "existing issue: $title"
            exit 0
          fi
          issue_body="${RUNNER_TEMP}/quarterly-dependency-review.md"
          cat > "$issue_body" <<EOF
          季度依赖盘点已完成：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          只允许基于最新 main 创建一张人工维护 PR；安全紧急修复除外。
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$issue_body"
