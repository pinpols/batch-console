name: renovate

# Renovate self-hosted on GitHub Actions —— 无外部服务依赖。
# 手动触发,扫依赖 + 开升级 PR(策略走 renovate.json)。
# 用 GITHUB_TOKEN(默认 permissions: contents/PR write)。
#
# 历史:曾每天 UTC 21:00 cron(配合 renovate.json `schedule:weekends`),但自动 PR
# 嘈杂,改为纯手动触发(2026-06-02)。
# 想升依赖 → Actions UI → renovate → Run workflow(可选 dry-run 看会开什么 PR)。

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        default: 'info'
        type: choice
        options: [info, debug, trace]
      dryRun:
        description: 'Dry-run only (不开 PR)'
        default: false
        type: boolean

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false # 跨次跑不打断,排队

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v40.3.6
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'false' }}
          # 限制只跑本仓
          RENOVATE_REPOSITORIES: ${{ github.repository }}
