name: full-ci-gate

# PR / main push / nightly 全量门禁(20-30 min)
# 内容:pr-gate 全套 + 完整 npm audit；Docker build/Trivy 与 Lighthouse
# 仅在非 PR 事件运行，避免和快速反馈门禁重复消耗资源。
# **不跑** Playwright e2e:CI 起 BE 太脆,交 staging-gate 真环境跑
# 对齐 BE 仓 full-ci-gate.yml 角色定位

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 周一 UTC 02:00 = Asia/Shanghai 10:00,每周一次出周报告。
    # 工作日 push main 已自动跑全量,daily nightly 是冗余;
    # 每周保留一次仍能拦"无 push 但 transitive deps 漂移"类问题。
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: full-ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the workflow/check names available for the branch ruleset, but do not
  # spend a full frontend build on a PR that only changes documentation.
  # Non-PR events always run the full gate.
  changes:
    name: Detect change scope
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pull request changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "docs-only=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          docs_only=true
          while IFS= read -r path; do
            case "${path}" in
              *.md|docs/**|.agents/**) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "docs-only=${docs_only}" >> "${GITHUB_OUTPUT}"

  # ── Job 1:静态检查 + 单测 + 完整 build(含 typecheck + i18n 二次跑) ────
  static-and-unit:
    name: Static checks + Unit
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check package version alignment
        run: npm run check:version

      - name: Check UTF-8 text encoding
        run: npm run check:encoding

      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run check:i18n

      - name: Check OpenAPI drift
        env:
          BE_OPENAPI_URL: ${{ secrets.BE_OPENAPI_URL || 'https://raw.githubusercontent.com/pinpols/file-batch-system/main/docs/api/console-api.openapi.yaml' }}
        run: npm run gen:api:check

      - name: Architecture, environment and documentation governance
        run: |
          npm run check:architecture
          npm run check:env
          npm run check:maintainability
          npm run check:workflows
          npm run check:shell
          npm run check:docs

      - name: Check SBOM and license snapshot drift
        run: npm run compliance:check

      - run: npm run test:unit -- --coverage

      # 完整 build(vue-tsc + i18n + vite build),验证生产产物可生成
      - run: npm run build

      # Bundle size budget(同 pr-gate)— full-ci 也复跑兜底
      - name: Bundle size budget
        run: npm run size

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Job 2:Docker 镜像 build + Trivy 漏洞扫描 ──────────────────────
  docker-and-scan:
    name: Docker build + Trivy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v7

      - name: Checkout backend documentation source
        uses: actions/checkout@v7
        with:
          repository: pinpols/file-batch-system
          ref: main
          path: backend-docs-source
          persist-credentials: false

      - name: Build Docker image
        run: docker build --build-context backend-docs=./backend-docs-source/docs -t batch-console:ci-${{ github.sha }} .

      # Trivy 镜像漏洞扫:只挡 CRITICAL(HIGH 警告但不挡,zero-day 噪音降级)
      - name: Trivy scan (CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'batch-console:ci-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Trivy scan (HIGH+CRITICAL report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'batch-console:ci-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 30

  # ── Job 3:Lighthouse 性能 + a11y + seo ─────────────────────────────
  lighthouse:
    name: Lighthouse (perf / a11y / SEO)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # 起 vite preview 后台跑 Lighthouse,首页 + login 两路径
      - name: Start preview server
        run: |
          npx vite preview --port 4173 > /tmp/preview.log 2>&1 &
          for _ in {1..30}; do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done

      # Lighthouse 只测 /login(/ 走 auth redirect 没初始 FCP,Lighthouse 报 NO_FCP);
      # continue-on-error:Lighthouse 是性能 informational,不挡 build(失败仍有 report 可看)
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            http://localhost:4173/login
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: '.github/lighthouse-budget.json'

  # ── Job 4:完整 npm audit(所有依赖 + 详细报告) ────────────────────
  security-audit:
    name: Security audit (full)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      # 全量 audit(含 dev),CRITICAL 挡 build,其他 report-only
      - name: npm audit (all deps, critical only blocks)
        run: |
          npm audit --json > /tmp/audit.json || true
          critical=$(jq '.metadata.vulnerabilities.critical // 0' /tmp/audit.json)
          high=$(jq '.metadata.vulnerabilities.high // 0' /tmp/audit.json)
          echo "Critical: $critical, High: $high"
          if [ "$critical" -gt 0 ]; then
            echo "::error::Critical vulnerabilities detected"
            npm audit --audit-level=critical
            exit 1
          fi
          if [ "$high" -gt 0 ]; then
            echo "::warning::$high high-severity vulnerabilities (review)"
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit
          path: /tmp/audit.json
          retention-days: 30
