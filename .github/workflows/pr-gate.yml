name: pr-gate

# PR 必过门禁 — fast feedback(< 10 min)
# 内容:lint / typecheck / OpenAPI drift / i18n / unit / build / npm audit
# **不跑**:Playwright e2e(慢 + 需 BE),交 staging-gate 真环境跑
# 对齐 BE 仓 pr-gate.yml 角色定位

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# 同 PR 上的过期任务取消,节约 Actions 分钟
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: Lint / Typecheck / Unit / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: ESLint（check 模式，不 auto-fix）
        run: npm run lint:check

      # 后端 console-api.openapi.yaml 改了但前端没跑 gen:api 提交,会在这里挂。
      # 本地开发也可直接 `npm run gen:api:check` 自查。
      # BE_OPENAPI_URL:CI 没有 sibling 仓库,从 raw GitHub 拉 yaml;脚本本地有
      # `../file-batch-system/docs/api/console-api.openapi.yaml` 时优先用本地。
      - name: Check OpenAPI drift
        env:
          BE_OPENAPI_URL: ${{ secrets.BE_OPENAPI_URL }}
        run: npm run gen:api:check

      - name: TypeCheck
        run: npm run typecheck

      # zh-CN ↔ en-US 1:1 对齐检查 — build 隐含会跑,这里前置以便快失败
      - name: i18n consistency
        run: npm run check:i18n

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Build (Vite 生产产物,跳重复 typecheck/i18n)
        run: npm run build:fast

      # 只挡 high+critical 严重度,low/moderate 噪音忽略
      # --omit=dev 跳 devDep(eslint/playwright/vitest 等 dev-time vuln 不影响产物)
      - name: npm audit (prod deps, high+critical only)
        run: npm audit --audit-level=high --omit=dev
