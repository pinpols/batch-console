name: pr-gate

# PR 必过门禁 — fast feedback(< 10 min)
# 内容:lint / typecheck / OpenAPI drift / i18n / unit / build / npm audit
# **不跑**:Playwright e2e(慢 + 需 BE),交 staging-gate 真环境跑
# 对齐 BE 仓 pr-gate.yml 角色定位

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# 同 PR 上的过期任务取消,节约 Actions 分钟
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: Lint / Typecheck / Unit / Build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BATCH_GATE_COLLECT: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        id: actionlint
        continue-on-error: true
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Check package version alignment
        run: bash scripts/ci/run-gate.sh FE_VERSION "版本对齐" -- npm run check:version

      - name: Check UTF-8 text encoding
        run: bash scripts/ci/run-gate.sh FE_ENCODING "UTF-8 编码" -- npm run check:encoding

      - name: Test gate failure aggregation
        run: bash scripts/ci/run-gate.sh FE_GATE_COLLECTION_TEST "门禁失败汇总自测" -- bash scripts/ci/test-gate-result-collection.sh

      - name: Check Chinese explanatory comments
        run: bash scripts/ci/run-gate.sh FE_COMMENTS "中文解释性注释" -- npm run check:comments

      - name: ESLint（check 模式，不 auto-fix）
        run: bash scripts/ci/run-gate.sh FE_LINT "ESLint" -- npm run lint:check

      # 后端 console-api.openapi.yaml 改了但前端没跑 gen:api 提交,会在这里挂。
      # 本地开发也可直接 `npm run gen:api:check` 自查。
      # BE_OPENAPI_URL:CI 没有 sibling 仓库,从 raw GitHub 拉 yaml;脚本本地有
      # `../file-batch-system/docs/api/console-api.openapi.yaml` 时优先用本地。
      - name: Check OpenAPI drift
        env:
          BE_OPENAPI_URL: ${{ secrets.BE_OPENAPI_URL || 'https://raw.githubusercontent.com/pinpols/file-batch-system/main/docs/api/console-api.openapi.yaml' }}
        run: bash scripts/ci/run-gate.sh FE_API_DRIFT "OpenAPI 漂移" -- npm run gen:api:check

      - name: Engineering governance
        run: bash scripts/verify-governance.sh

      - name: TypeCheck
        run: bash scripts/ci/run-gate.sh FE_TYPECHECK "TypeScript 类型检查" -- npm run typecheck

      # zh-CN ↔ en-US 1:1 对齐检查 — build 隐含会跑,这里前置以便快失败
      - name: i18n consistency
        run: bash scripts/ci/run-gate.sh FE_I18N "国际化词条一致性" -- npm run check:i18n

      - name: Unit tests (Vitest) + coverage gate
        run: bash scripts/ci/run-gate.sh FE_UNIT "Vitest 单测与覆盖率" -- npm run test:unit -- --coverage

      - name: Build (Vite 生产产物,跳重复 typecheck/i18n)
        run: bash scripts/ci/run-gate.sh FE_BUILD "Vite 生产构建" -- npm run build:fast

      # Bundle size budget — vendor-element-plus 340KB / vendor-vue 60KB / index 200KB
      # (brotli;实测 247/40/139KB,约 30% headroom)。超阈值 PR 直接 fail,
      # 防 vendor 渐进膨胀。配置在 package.json#size-limit。
      - name: Bundle size budget
        run: bash scripts/ci/run-gate.sh FE_BUNDLE_SIZE "Bundle 体积预算" -- npm run size

      # 只挡 high+critical 严重度,low/moderate 噪音忽略
      # --omit=dev 跳 devDep(eslint/playwright/vitest 等 dev-time vuln 不影响产物)
      - name: npm audit (prod deps, high+critical only)
        run: bash scripts/ci/run-gate.sh FE_NPM_AUDIT "生产依赖漏洞审计" -- npm audit --audit-level=high --omit=dev

      - name: Report all gate failures
        if: always()
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          if [[ "$ACTIONLINT_OUTCOME" == "failure" ]]; then
            gate_result FAIL FE_ACTIONLINT "GitHub Actions 语法" 1
            gate_record_failure FE_ACTIONLINT "GitHub Actions 语法" 1
          fi
          gate_assert_collected
