name: frontend-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pull request changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "docs-only=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          docs_only=true
          while IFS= read -r path; do
            case "${path}" in
              *.md|docs/**|.agents/**) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "docs-only=${docs_only}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Node 24 compatibility
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check package version alignment
        run: npm run check:version
      - name: Typecheck
        run: npm run typecheck
      - name: Check translations
        run: npm run check:i18n
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build

  frontend-docs:
    name: Frontend documentation build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: pinpols/file-batch-system
          path: backend-docs-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build unified documentation
        run: npm run docs:build
        env:
          FRONTEND_DOCS_ROOT: ${{ github.workspace }}/docs
          BACKEND_DOCS_ROOT: ${{ github.workspace }}/backend-docs-source/docs
