name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# 取消同 PR 上的过期任务，节约 Actions 分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint / Typecheck / Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: ESLint（check 模式，不 auto-fix）
        run: npm run lint:check

      # 后端 console-api.openapi.yaml 改了但前端没跑 gen:api 提交,会在这里挂。
      # 本地开发也可直接 `npm run gen:api:check` 自查。
      # BE_OPENAPI_URL:CI 没有 sibling 仓库,从 raw GitHub 拉 yaml;脚本本地有
      # `../file-batch-system/docs/api/console-api.openapi.yaml` 时优先用本地。
      - name: Check OpenAPI drift
        env:
          BE_OPENAPI_URL: ${{ secrets.BE_OPENAPI_URL }}
        run: npm run gen:api:check

      - name: TypeCheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build:fast
