name: build-image

# 前端镜像构建 + 推送 ghcr.io/pinpols/batch-console。
# main push:构建 sha + latest 多架构不可变镜像。
# tag(v*) push:等待同 commit 的 staging-gate 成功后，只给既有 sha 镜像增加 release tag，
# 不重新构建，保证 staging 验收与发布制品 digest 一致。
#
# 注意:本文件挂在 push:main 上,合并进 main 后才会随 main push 触发;
#       在 feature 分支期间可用 Actions 页面的 workflow_dispatch 选该分支手动验证。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/pinpols/batch-console

jobs:
  release-acceptance:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for staging acceptance of this revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            result=$(gh run list --repo "$REPO" --workflow staging-gate.yml --commit "$SHA" \
              --json status,conclusion,databaseId --limit 5 \
              --jq 'map(select(.status == "completed"))[0] | [.databaseId, .conclusion] | @tsv' 2>/dev/null || true)
            if [ -n "$result" ]; then
              run_id=$(printf '%s' "$result" | cut -f1)
              conclusion=$(printf '%s' "$result" | cut -f2)
              echo "staging-gate run=$run_id conclusion=$conclusion"
              test "$conclusion" = "success"
              exit 0
            fi
            sleep 30
          done
          echo "::error::未找到当前 commit 的成功 staging-gate。"
          exit 1

  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout backend documentation source
        uses: actions/checkout@v5
        with:
          repository: pinpols/file-batch-system
          ref: main
          path: backend-docs-source
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 与 Dockerfile 默认值一致：镜像构建同时执行 typecheck、i18n 检查和 Vite build。
          build-args: |
            BUILD_MODE=build
            VITE_GIT_SHA=${{ github.sha }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_TELEMETRY_ENABLED=${{ vars.VITE_TELEMETRY_ENABLED || 'false' }}
            VITE_TELEMETRY_ENDPOINT=${{ vars.VITE_TELEMETRY_ENDPOINT || '/api/console/telemetry/events' }}
          build-contexts: |
            backend-docs=./backend-docs-source/docs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote accepted immutable image
        env:
          SOURCE_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
          RELEASE_IMAGE: ${{ env.IMAGE }}:${{ github.ref_name }}
        run: docker buildx imagetools create --tag "$RELEASE_IMAGE" "$SOURCE_IMAGE"

  release-sourcemaps:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: promote-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: sentry
        name: Validate Sentry release configuration
        env:
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "$SENTRY_DSN" ] && [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Sentry disabled; sourcemap upload not required."
            exit 0
          fi
          if [ -z "$SENTRY_DSN" ] || [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::error::Sentry is partially configured; DSN, auth token, org and project must be complete."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.sentry.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Build hidden sourcemaps
        if: steps.sentry.outputs.enabled == 'true'
        env:
          SENTRY_SOURCEMAPS: 'true'
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm ci --no-audit --no-fund && npm run build:fast
      - name: Upload Sentry sourcemaps
        if: steps.sentry.outputs.enabled == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          release=$(node -p "require('./package.json').version")
          npx sentry-cli sourcemaps inject dist
          npx sentry-cli sourcemaps upload --release "$release" dist
