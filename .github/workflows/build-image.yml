name: build-image

# 前端镜像构建 + 推送 ghcr.io/pinpols/batch-console。
# main push:tag = sha + latest。
# tag(v*) push:发布场景,额外打 release tag(如 v1.2.3)。
# 对齐 BE 仓 build-image.yml;不接 K8s,部署走自托管 runner 的 deploy.yml 或人工 SOP。
#
# 注意:本文件挂在 push:main 上,合并进 main 后才会随 main push 触发;
#       在 feature 分支期间可用 Actions 页面的 workflow_dispatch 选该分支手动验证。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/pinpols/batch-console

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # main push:只构 amd64(快)。tag(v*)release 才构 multi-arch 兼容 ARM 服务器。
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          # build:fast = 只跑 vite build(typecheck 已由 pr-gate / full-ci-gate 单独门禁过)
          build-args: |
            BUILD_MODE=build:fast
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
