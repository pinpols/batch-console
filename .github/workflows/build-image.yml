name: Frontend / Build and publish image

# 前端镜像构建 + 推送 ghcr.io/pinpols/batch-console。
# main push:构建 sha + latest 多架构不可变镜像。
# tag(v*) push:等待同 commit 的 staging-gate 成功后，只给既有 sha 镜像增加 release tag，
# 不重新构建，保证 staging 验收与发布制品 digest 一致。
#
# nightly:按本次 19:00 UTC 调度所属的北京时间前一日检查前后端代码变更。
#          后端有变更时，只接受该日前端所等待的后端 13:31 UTC 档期
#          （含延迟跨过 UTC 或北京时间午夜的启动）以及该北京时间当日的手动重跑。
#          sim-and-strict 必须成功且覆盖验证日结束前的后端主干提交，构建固定到实际验证的 SHA。
# 注意:main push/tag 发布路径不改变；feature 分支可用 workflow_dispatch 手动验证。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # 北京时间 03:00，给后端 21:31 nightly sim 留出完成窗口。
    - cron: '0 19 * * *'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      source_ref:
        description: Exact frontend commit to build
        required: true
        type: string
      backend_ref:
        description: Exact backend commit used for shared documentation
        required: true
        type: string
    secrets:
      VITE_SENTRY_DSN:
        description: Optional Sentry DSN embedded in the frontend build
        required: false
      SENTRY_AUTH_TOKEN:
        description: Optional token used to upload release sourcemaps
        required: false
    outputs:
      image_digest:
        description: Immutable GHCR digest of the frontend image
        value: ${{ jobs.build.outputs.image_digest }}

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/pinpols/batch-console

jobs:
  nightly-sim-gate:
    name: Nightly backend sim-strict gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      backend_sha: ${{ steps.gate.outputs.backend_sha }}
    steps:
      - name: Checkout frontend history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout backend history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pinpols/file-batch-system
          ref: main
          path: backend-sim-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Check daily changes and backend sim-strict
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_REPOSITORY: pinpols/file-batch-system
          BACKEND_WORKFLOW: daily-sim-strict-validation.yml
        shell: bash
        run: |
          set -euo pipefail

          code_changed() {
            local repo="$1"
            set +e
            node scripts/ci/nightly-sim-gate.mjs changed --repo "$repo" --since "$since" --until "$until"
            local status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              return 0
            fi
            if [[ "$status" -eq 1 ]]; then
              return 1
            fi
            exit "$status"
          }

          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          plan=$(node scripts/ci/nightly-sim-gate.mjs plan --now "$now")
          validation_day=$(jq -r '.validationDay' <<<"$plan")
          since=$(jq -r '.since' <<<"$plan")
          until=$(jq -r '.until' <<<"$plan")
          list_since=$(jq -r '.listSince' <<<"$plan")

          frontend_changed=false
          backend_changed=false
          code_changed . && frontend_changed=true || true
          code_changed backend-sim-source && backend_changed=true || true

          target_sha=$(node scripts/ci/nightly-sim-gate.mjs snapshot \
            --repo backend-sim-source --before "$until")
          echo "target backend commit: ${target_sha}"
          echo "validation day: ${validation_day}"
          echo "code window: ${since} .. ${until}"
          echo "backend slot list since: ${list_since}"
          echo "frontend code changed: ${frontend_changed}"
          echo "backend code changed: ${backend_changed}"

          if [[ "$backend_changed" == false ]]; then
            if [[ "$frontend_changed" == false ]]; then
              echo "当天没有前后端代码/配置变更，跳过 nightly 前端镜像构建。"
              echo 'should_build=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "backend_sha=${target_sha}" >> "$GITHUB_OUTPUT"
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "等待 ${BACKEND_REPOSITORY} 验证日 ${validation_day} 的 daily sim-strict..."
          decision=''
          for _ in $(seq 1 60); do
            if ! runs=$(gh run list --repo "$BACKEND_REPOSITORY" \
              --workflow "$BACKEND_WORKFLOW" --branch main --limit 50 \
              --created ">=${list_since}" \
              --json databaseId,createdAt,event,status,conclusion,headSha,attempt,url); then
              echo "查询后端 sim run 失败，稍后重试。"
              sleep 60
              continue
            fi
            if ! enriched=$(node scripts/ci/nightly-sim-gate.mjs enrich --repo "$BACKEND_REPOSITORY" <<<"$runs"); then
              echo "读取后端 sim job 失败，稍后重试。"
              sleep 60
              continue
            fi
            decision=$(node scripts/ci/nightly-sim-gate.mjs decide \
              --now "$now" \
              --target-sha "$target_sha" \
              --frontend-changed "$frontend_changed" \
              --backend-changed "$backend_changed" \
              --repo backend-sim-source <<<"$enriched")
            action=$(jq -r '.action' <<<"$decision")
            echo "sim gate $(jq -r '[.action, .code, (.runId // "none")] | @tsv' <<<"$decision")"
            [[ "$action" == wait ]] || break
            sleep 60
          done

          if [[ -z "$decision" ]]; then
            echo "::error::查询后端 ${validation_day} daily sim-strict 失败。"
            exit 1
          fi
          action=$(jq -r '.action' <<<"$decision")
          if [[ "$action" == wait ]]; then
            decision=$(node scripts/ci/nightly-sim-gate.mjs conclude <<<"$decision")
            action=$(jq -r '.action' <<<"$decision")
          fi
          if [[ "$action" != build ]]; then
            echo "::error::$(jq -r '.message' <<<"$decision")"
            exit 1
          fi
          jq -r '.message' <<<"$decision"
          validated_sha=$(jq -er '.headSha' <<<"$decision")
          echo "backend_sha=${validated_sha}" >> "$GITHUB_OUTPUT"
          echo 'should_build=true' >> "$GITHUB_OUTPUT"

  release-acceptance:
    name: Verify staging acceptance before release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Wait for staging acceptance of this revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            result=$(gh run list --repo "$REPO" --workflow staging-gate.yml --commit "$SHA" \
              --json status,conclusion,databaseId --limit 5 \
              --jq 'map(select(.status == "completed"))[0] | [.databaseId, .conclusion] | @tsv' 2>/dev/null || true)
            if [ -n "$result" ]; then
              run_id=$(printf '%s' "$result" | cut -f1)
              conclusion=$(printf '%s' "$result" | cut -f2)
              echo "staging-gate run=$run_id conclusion=$conclusion"
              test "$conclusion" = "success"
              exit 0
            fi
            sleep 30
          done
          echo "::error::未找到当前 commit 的成功 staging-gate。"
          exit 1

  build:
    name: Build and publish frontend image
    needs: nightly-sim-gate
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    if: >-
      always() &&
      (
        github.ref == 'refs/heads/main' && github.event_name != 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_call' ||
        (github.event_name == 'schedule' && needs.nightly-sim-gate.result == 'success'
          && needs.nightly-sim-gate.outputs.should_build == 'true')
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pinpols/batch-console
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Checkout backend documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pinpols/file-batch-system
          ref: ${{ inputs.backend_ref || needs.nightly-sim-gate.outputs.backend_sha || 'main' }}
          path: backend-docs-source
          persist-credentials: false

      - name: Verify requested source revisions
        if: github.event_name == 'workflow_call'
        env:
          EXPECTED_FRONTEND_SHA: ${{ inputs.source_ref }}
          EXPECTED_BACKEND_SHA: ${{ inputs.backend_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_ref must be a full 40-character lowercase Git SHA."
            exit 2
          }
          [[ "$EXPECTED_BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::backend_ref must be a full 40-character lowercase Git SHA."
            exit 2
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_FRONTEND_SHA" ]] || {
            echo "::error::Frontend checkout does not match source_ref."
            exit 2
          }
          [[ "$(git -C backend-docs-source rev-parse HEAD)" == "$EXPECTED_BACKEND_SHA" ]] || {
            echo "::error::Backend docs checkout does not match backend_ref."
            exit 2
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ inputs.source_ref || github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.source=https://github.com/pinpols/batch-console
            org.opencontainers.image.revision=${{ inputs.source_ref || github.sha }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 与 Dockerfile 默认值一致：镜像构建同时执行 typecheck、i18n 检查和 Vite build。
          build-args: |
            BUILD_MODE=build
            VITE_GIT_SHA=${{ inputs.source_ref || github.sha }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_TELEMETRY_ENABLED=${{ vars.VITE_TELEMETRY_ENABLED || 'false' }}
            VITE_TELEMETRY_ENDPOINT=${{ vars.VITE_TELEMETRY_ENDPOINT || '/api/console/telemetry/events' }}
            VITE_GRAFANA_URL=${{ vars.VITE_GRAFANA_URL || '' }}
            VITE_TEMPO_URL=${{ vars.VITE_TEMPO_URL || '' }}
          build-contexts: |
            backend-docs=./backend-docs-source/docs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-release:
    name: Promote validated release image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-acceptance
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote accepted immutable image
        env:
          SOURCE_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
          RELEASE_IMAGE: ${{ env.IMAGE }}:${{ github.ref_name }}
        run: docker buildx imagetools create --tag "$RELEASE_IMAGE" "$SOURCE_IMAGE"

  release-sourcemaps:
    name: Upload release source maps
    if: startsWith(github.ref, 'refs/tags/v')
    needs: promote-release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: sentry
        name: Validate Sentry release configuration
        env:
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "$SENTRY_DSN" ] && [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Sentry disabled; sourcemap upload not required."
            exit 0
          fi
          if [ -z "$SENTRY_DSN" ] || [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::error::Sentry is partially configured; DSN, auth token, org and project must be complete."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.sentry.outputs.enabled == 'true'
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Build hidden sourcemaps
        if: steps.sentry.outputs.enabled == 'true'
        env:
          SENTRY_SOURCEMAPS: 'true'
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm ci --no-audit --no-fund && npm run build:fast
      - name: Upload Sentry sourcemaps
        if: steps.sentry.outputs.enabled == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          release=$(node -p "require('./package.json').version")
          npx sentry-cli sourcemaps inject dist
          npx sentry-cli sourcemaps upload --release "$release" dist
