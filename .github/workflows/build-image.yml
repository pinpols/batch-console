name: build-image

# 前端镜像构建 + 推送 ghcr.io/pinpols/batch-console。
# main push:构建 sha + latest 多架构不可变镜像。
# tag(v*) push:等待同 commit 的 staging-gate 成功后，只给既有 sha 镜像增加 release tag，
# 不重新构建，保证 staging 验收与发布制品 digest 一致。
#
# nightly:按北京时间前一日的前后端代码变更决定是否构建；后端有变更时，
#          必须等待配对后端 daily-sim-strict-validation 的 sim-and-strict 成功。
# 注意:main push/tag 发布路径不改变；feature 分支可用 workflow_dispatch 手动验证。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # 北京时间 03:00，给后端 21:31 nightly sim 留出完成窗口。
    - cron: '0 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/pinpols/batch-console

jobs:
  nightly-sim-gate:
    name: Nightly backend sim-strict gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - name: Checkout frontend history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout backend history
        uses: actions/checkout@v7
        with:
          repository: pinpols/file-batch-system
          ref: main
          path: backend-sim-source
          fetch-depth: 0
          persist-credentials: false

      - name: Check daily changes and backend sim-strict
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_REPOSITORY: pinpols/file-batch-system
          BACKEND_WORKFLOW: daily-sim-strict-validation.yml
        shell: bash
        run: |
          set -euo pipefail

          validation_day=$(TZ=Asia/Shanghai date -d 'yesterday' +%F)
          next_day=$(TZ=Asia/Shanghai date -d "${validation_day} +1 day" +%F)
          since="${validation_day} 00:00:00 +0800"
          until="${next_day} 00:00:00 +0800"

          has_code_changes() {
            local repo="$1"
            git -C "$repo" log --since="$since" --until="$until" \
              --format= --name-only --no-renames HEAD \
              | awk 'NF && $0 !~ /(^|\/)([^/]+\.(md|rst)|LICENSE|NOTICE)$/ { found=1 } END { exit found ? 0 : 1 }'
          }

          frontend_changed=false
          backend_changed=false
          has_code_changes . && frontend_changed=true || true
          has_code_changes backend-sim-source && backend_changed=true || true

          echo "validation day: ${validation_day}"
          echo "frontend code changed: ${frontend_changed}"
          echo "backend code changed: ${backend_changed}"

          if [[ "$frontend_changed" == false && "$backend_changed" == false ]]; then
            echo "当天没有前后端代码/配置变更，跳过 nightly 前端镜像构建。"
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$backend_changed" == true ]]; then
            echo "等待 ${BACKEND_REPOSITORY} 当天 daily sim-strict 完成..."
            sim_run_id=''
            jq_filter=$(printf '.[] | select(.createdAt | startswith("%s")) | .databaseId' "$validation_day")
            for _ in $(seq 1 60); do
              sim_run_id=$(gh run list --repo "$BACKEND_REPOSITORY" \
                --workflow "$BACKEND_WORKFLOW" --limit 30 \
                --json databaseId,createdAt \
                --jq "$jq_filter" \
                2>/dev/null | head -n 1 || true)
              [[ -n "$sim_run_id" ]] && break
              sleep 60
            done
            [[ -n "$sim_run_id" ]] || {
              echo "::error::未找到后端 ${validation_day} 的 daily sim-strict run。"
              exit 1
            }

            for _ in $(seq 1 60); do
              job_state=$(gh api --paginate \
                "repos/${BACKEND_REPOSITORY}/actions/runs/${sim_run_id}/jobs?per_page=100" \
                --jq '.jobs[] | select(.name == "sim-and-strict") | [.status, .conclusion] | @tsv' \
                2>/dev/null | tail -n 1 || true)
              status=$(printf '%s' "$job_state" | cut -f1)
              conclusion=$(printf '%s' "$job_state" | cut -f2)
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || {
                  echo "::error::后端 daily sim-strict 未成功: run=${sim_run_id}, conclusion=${conclusion:-unknown}"
                  exit 1
                }
                break
              fi
              sleep 60
            done

            [[ "$status" == completed && "$conclusion" == success ]] || {
              echo "::error::后端 daily sim-strict 等待超时: run=${sim_run_id}"
              exit 1
            }
          fi

          echo 'should_build=true' >> "$GITHUB_OUTPUT"

  release-acceptance:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Wait for staging acceptance of this revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            result=$(gh run list --repo "$REPO" --workflow staging-gate.yml --commit "$SHA" \
              --json status,conclusion,databaseId --limit 5 \
              --jq 'map(select(.status == "completed"))[0] | [.databaseId, .conclusion] | @tsv' 2>/dev/null || true)
            if [ -n "$result" ]; then
              run_id=$(printf '%s' "$result" | cut -f1)
              conclusion=$(printf '%s' "$result" | cut -f2)
              echo "staging-gate run=$run_id conclusion=$conclusion"
              test "$conclusion" = "success"
              exit 0
            fi
            sleep 30
          done
          echo "::error::未找到当前 commit 的成功 staging-gate。"
          exit 1

  build:
    needs: nightly-sim-gate
    if: >-
      always() &&
      (
        github.ref == 'refs/heads/main' && github.event_name != 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && needs.nightly-sim-gate.result == 'success'
          && needs.nightly-sim-gate.outputs.should_build == 'true')
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout backend documentation source
        uses: actions/checkout@v7
        with:
          repository: pinpols/file-batch-system
          ref: main
          path: backend-docs-source
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 与 Dockerfile 默认值一致：镜像构建同时执行 typecheck、i18n 检查和 Vite build。
          build-args: |
            BUILD_MODE=build
            VITE_GIT_SHA=${{ github.sha }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_TELEMETRY_ENABLED=${{ vars.VITE_TELEMETRY_ENABLED || 'false' }}
            VITE_TELEMETRY_ENDPOINT=${{ vars.VITE_TELEMETRY_ENDPOINT || '/api/console/telemetry/events' }}
          build-contexts: |
            backend-docs=./backend-docs-source/docs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-acceptance
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote accepted immutable image
        env:
          SOURCE_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
          RELEASE_IMAGE: ${{ env.IMAGE }}:${{ github.ref_name }}
        run: docker buildx imagetools create --tag "$RELEASE_IMAGE" "$SOURCE_IMAGE"

  release-sourcemaps:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: promote-release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: sentry
        name: Validate Sentry release configuration
        env:
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "$SENTRY_DSN" ] && [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Sentry disabled; sourcemap upload not required."
            exit 0
          fi
          if [ -z "$SENTRY_DSN" ] || [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::error::Sentry is partially configured; DSN, auth token, org and project must be complete."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.sentry.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Build hidden sourcemaps
        if: steps.sentry.outputs.enabled == 'true'
        env:
          SENTRY_SOURCEMAPS: 'true'
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm ci --no-audit --no-fund && npm run build:fast
      - name: Upload Sentry sourcemaps
        if: steps.sentry.outputs.enabled == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          release=$(node -p "require('./package.json').version")
          npx sentry-cli sourcemaps inject dist
          npx sentry-cli sourcemaps upload --release "$release" dist
